<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моніторинг та Конфігурація</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        .spec { margin-bottom: 15px; font-size: 1.1em; color: #555; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .box { background: #f8f9fa; padding: 20px; border-radius: 6px; border-left: 4px solid #28a745; }
        select, button { padding: 10px; font-size: 16px; margin-top: 5px; border-radius: 4px; box-sizing: border-box; width: 100%; }
        select { border: 1px solid #ccc; margin-bottom: 15px; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #007bff; text-decoration: none; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">⬅ Повернутися до дашборду</a>
        
        <h2 id="deviceName">Завантаження...</h2>
        <div class="spec" id="deviceProtocol"></div>

        <div class="grid">
            <div class="box">
                <h3>⚙️ Параметри сенсора</h3>
                <label for="accuracy">Клас точності:</label>
                <select id="accuracy">
                    <option value="A">Клас А (Висока)</option>
                    <option value="B">Клас В (Стандарт)</option>
                </select>

                <label for="rate">Частота опитування:</label>
                <select id="rate">
                    <option value="1s">1 раз на секунду</option>
                    <option value="5s"> кожні 5 секунд</option>
                </select>
                <button onclick="saveConfig()">Застосувати</button>
            </div>

            <div class="box" style="border-left-color: #0d6efd;">
                <h3>📈 Тренд вимірювань</h3>
                <canvas id="trendChart" width="300" height="150"></canvas>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name') || 'Пристрій';
        const protocol = params.get('protocol') || 'N/A';

        document.getElementById('deviceName').textContent = `Параметри: ${name}`;
        document.getElementById('deviceProtocol').innerHTML = `<strong>Інтерфейс шини:</strong> ${protocol}`;

        const ctx = document.getElementById('trendChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['10с', '8с', '6с', '4с', '2с', 'Зараз'],
                datasets: [{
                    label: 'Значення сигналу',
                    data: [21.0, 21.3, 21.1, 21.5, 21.8, 22.0],
                    borderColor: '#0d6efd',
                    tension: 0.3,
                    fill: false
                }]
            },
            options: { responsive: true, scales: { y: { beginAtZero: false } } }
        });

        setInterval(() => {
            const newValue = (20 + Math.random() * 3).toFixed(2);
            chart.data.labels.shift();
            chart.data.labels.push(new Date().toLocaleTimeString());
            chart.data.datasets[0].data.shift();
            chart.data.datasets[0].data.push(newValue);
            chart.update();
        }, 2000);

        function saveConfig() {
            alert(`Конфігурацію для пристрою "${name}" успішно оновлено на шині даних!`);
        }
    </script>
</body>
</html>
